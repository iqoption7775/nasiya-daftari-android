name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: APK yig'ish
        id: build
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Natijani build-output tarmog'iga saqlash
        if: always()
        run: |
          mkdir -p out
          cp build.log out/build.log 2>/dev/null || echo "build.log yo'q" > out/build.log
          cp app/build/outputs/apk/release/*.apk out/nasiya-daftari.apk 2>/dev/null || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} result=${{ steps.build.outcome }}" > out/RESULT.txt
          cd out
          git init -q
          git checkout -q -b build-output
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output
