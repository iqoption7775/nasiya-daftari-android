plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.nasiyadaftari.app'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.nasiyadaftari.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/nasiya-release.jks')
            storePassword project.property('NASIYA_STORE_PASSWORD')
            keyAlias 'nasiya'
            keyPassword project.property('NASIYA_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
